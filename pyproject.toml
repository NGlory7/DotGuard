[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotguard"
version = "1.1.0"
description = "Standalone Threat & NSFW Inspector for Unicode Braille, ASCII Art and Direct Images"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DotGuard Team"}
]
keywords = ["security", "computer-vision", "content-moderation", "braille", "ascii-art", "threat-detection", "nsfw"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
]

[project.scripts]
dotguard = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dotguard*", "tests*"]
